# surefold-core's release.yml, kept ready here and unused until the first
# release of all three repositories (surefold-core's spec 0301, question 5).
# Until then nothing starts it on its own: no tag trigger, so a tag pushed by
# hand releases nothing, and a dispatch needs a version. When the first release
# comes, a `push: tags: ["v*", "!v*-*"]` trigger can come back as in core.
name: release

on:
  # A dispatch with a version cuts that release from a commit on main: this
  # workflow tags it, so nobody has to push a tag from a laptop. A tag pushed by
  # the workflow's own token would not start another workflow, which is why the
  # tagging happens here rather than in a workflow of its own.
  workflow_dispatch:
    inputs:
      version:
        description: "Release to cut, e.g. 0.18.1. Tags v<version> on `commit`."
        type: string
        required: true
      commit:
        description: "Commit on main to tag. Empty: the head of main."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    # To push the tag this run creates, at the end and only once Central has the
    # release. Nothing else here writes to the repository.
    permissions:
      contents: write
      packages: read
    # On the job rather than on the publish step: a tag gives axion a version with
    # no `-SNAPSHOT`, which is what makes Gradle's signing required, and `build`
    # signs the publications before anything is published. A PR never noticed
    # because a snapshot is signed by nobody and the task simply skips.
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # The build declares the upstreams' GitHub Packages repositories, which ask for a token even to read.
      ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # axion reads the tag to decide the version, and a shallow clone has none.
          fetch-depth: 0
          ref: ${{ inputs.commit || 'main' }}

      # A release here names the surefold-core and surefold-integrations releases it was built against
      # (surefold-core's spec 0301, question 3), and a snapshot is not one: Central would hold a POM depending on a
      # version that is not on Central.
      - name: Refuse a release on an upstream snapshot
        run: |
          for pin in surefoldCore surefoldIntegrations; do
            version=$(sed -n "s/^$pin=//p" gradle.properties)
            echo "$pin: $version"
            case "$version" in
              ""|*-SNAPSHOT) echo "pin $pin to a release before releasing"; exit 1 ;;
            esac
          done

      # Local first, so axion reads the release version for the build and the
      # publish below; pushed in the last step, once the publish has succeeded,
      # so a failed build leaves no tag behind. A tag that already exists on the
      # same commit is a re-run and is reused; on another commit it is refused.
      - name: Tag the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            *[!0-9.]*|.*|*.|*..*) echo "$VERSION is not a release version (X.Y.Z)"; exit 1 ;;
          esac
          [ "$(echo "$VERSION" | tr -cd . | wc -c)" = 2 ] || { echo "$VERSION is not X.Y.Z"; exit 1; }
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main || { echo "$commit is not on main"; exit 1; }
          tag="v$VERSION"
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            [ "$existing" = "$commit" ] || { echo "$tag already tags $existing, not $commit"; exit 1; }
            echo "$tag already tags $commit"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "$tag" "$commit" -m "surefold-platform $VERSION"
            echo "tagged $commit as $tag"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # The gates first. A release that has not passed them is a release nobody
      # can withdraw. Two workers, as build.yml runs them (surefold-core's
      # v0.10.1 and v0.11.0 failed with more).
      - run: ./gradlew build --max-workers=2 --stacktrace

      # The last non-blank line's last word: `currentVersion` prints a banner too, and a
      # multi-line value is one GITHUB_OUTPUT refuses rather than truncates.
      - id: version
        run: echo "value=$(./gradlew -q currentVersion | awk 'NF { last = $NF } END { print last }')" >> "$GITHUB_OUTPUT"

      # A dispatch from a branch or a candidate tag would publish a version that
      # is not a release.
      - name: Refuse anything but a release
        run: |
          version="${{ steps.version.outputs.value }}"
          case "$version" in
            "") echo "could not read the version"; exit 1 ;;
            *-*) echo "$version is not a release; snapshot.yml publishes candidates"; exit 1 ;;
          esac
          if [ "$version" != "$ASKED" ]; then
            echo "asked to release $ASKED, but the build reads $version"; exit 1
          fi
        env:
          ASKED: ${{ inputs.version }}

      # A tag can be re-run, and Central refuses a version it already has — with a
      # message about the upload rather than about the re-run. Saying so here is
      # the difference between a red job somebody has to read and a green one.
      #
      # Asked once per namespace, since each is a deployment of its own (below): a re-run after only
      # one of them was released publishes the other.
      - id: already
        run: |
          version="${{ steps.version.outputs.value }}"
          on_central() {
            url="https://repo1.maven.org/maven2/$1/surefold-jobs/$version/surefold-jobs-$version.pom"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            [ "$code" = "200" ] && echo yes || echo no
          }
          released=$(on_central dev/surefold)
          relocated=$(on_central io/github/matthewjones372)
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "relocated=$relocated" >> "$GITHUB_OUTPUT"
          echo "$version under dev.surefold on Central: $released; its relocation POMs: $relocated"

      # Every module's javadoc jar, six modules to a Gradle run. Dokka's worker
      # process keeps the classes of each module it renders, and one run rendering
      # all of them had the daemon killed mid-publish in surefold-core (v0.11.0,
      # v0.12.0). A run of its own ends its workers; the publish below then finds
      # every javadoc up to date.
      - if: steps.already.outputs.released != 'yes' || steps.already.outputs.relocated != 'yes'
        name: Javadoc, six modules at a time
        run: |
          ./gradlew --stop
          tasks=$(./gradlew --no-daemon -q tasks --all | grep -oE '^[a-z0-9-]+:dokkaGeneratePublicationHtml' | sort -u | sed 's/^/:/')
          echo "$tasks" | xargs -n 6 ./gradlew --no-daemon --max-workers=2

      # Staged rather than released: the Portal is where somebody looks at what
      # is about to become permanent and presses the button.
      #
      # Two deployments, one per namespace: the Portal refuses a deployment with
      # files for both, and a Gradle run uploads one. `centralNamespace` (the
      # root build) picks which publications a run sends; dev.surefold is the
      # default, and the relocation POMs at the old group (spec 0277) go second.
      - if: steps.already.outputs.released != 'yes'
        name: dev.surefold to Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache --max-workers=2

      - if: steps.already.outputs.relocated != 'yes'
        name: The relocation POMs at io.github.matthewjones372 to Central
        run: >
          ./gradlew publishToMavenCentral --no-configuration-cache --max-workers=2
          -PcentralNamespace=io.github.matthewjones372

      # Last, and only after both deployments are staged: the tag is the record
      # of what was released.
      - name: Push the tag
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin "refs/tags/v$VERSION"
