org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Publishing goes to the Central Portal, which is the only way in since OSSRH
# closed. The uploaded bundle is left staged rather than released: a staged
# bundle can be dropped, a released one is on Maven Central for good. Set
# mavenCentralAutomaticPublishing=true to release without the click.
mavenCentralPublishing=true

# Signing is required for a release version and skipped for a -SNAPSHOT, which
# is what an untagged commit builds as — so a contributor with no key can still
# run `publishToMavenLocal`, and a tagged build cannot go out unsigned.
signAllPublications=true

# The upstream snapshots this repository builds and tests against, from
# https://maven.pkg.github.com/surefold/<repository> (surefold-core's spec 0281).
# Moving to a newer one is a pull request that bumps its line and is green. With
# ../surefold-core or ../surefold-integrations checked out beside this one, its
# source is used instead.
surefoldCore=0.18.1
surefoldIntegrations=0.18.1
